name: Windows tests

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-source-checks:
    name: Python ${{ matrix.python-version }} unit and source checks
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "src"
          python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src/frontdoor tests scripts

      - name: Check whitespace errors
        run: git diff --check
