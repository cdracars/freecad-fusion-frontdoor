[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-fusion-frontdoor"
version = "0.1.0"
description = "A Windows frontdoor for a separate Fusion-style FreeCAD setup"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]

[project.scripts]
freecad-frontdoor = "frontdoor.app:main"
frontdoor-setup = "frontdoor.setup_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
