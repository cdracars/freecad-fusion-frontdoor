[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-fusion-frontdoor"
version = "0.1.0"
description = "A Windows frontdoor for a separate Fusion-style FreeCAD setup"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]

[project.scripts]
freecad-frontdoor = "frontdoor.app:main"
frontdoor-setup = "frontdoor.setup_cli:main"
frontdoor-smoke = "frontdoor.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"frontdoor.freecad_addon.FrontdoorUI" = ["package.xml", "README.md"]

[tool.pyside6.deploy]
title = "FreeCAD Fusion Frontdoor"
input_file = "scripts/frontdoor_entry.py"
exec_directory = "build/windows"
mode = "standalone"
extra_args = "--windows-console-mode=disable --include-data-files=src/frontdoor/freecad_addon/frontdoor_ui_payload.zip=frontdoor/freecad_addon/frontdoor_ui_payload.zip"
